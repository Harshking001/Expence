<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-xl">
          <i data-lucide="wallet" class="w-6 h-6 text-white"></i>
        </div>
        <h1 class="text-xl font-bold text-white">Expense Tracker</h1>
      </div>
      <button id="clearAllBtn" class="text-xs bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 border border-rose-500/20 px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5">
        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All Data
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">

    <!-- Stat Cards Summary -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5">
        <div class="flex items-center justify-between text-slate-400 mb-2">
          <span class="text-sm font-medium">Total Balance</span>
          <i data-lucide="dollar-sign" class="w-5 h-5 text-indigo-400"></i>
        </div>
        <div id="totalBalance" class="text-3xl font-bold text-white">$0.00</div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5">
        <div class="flex items-center justify-between text-slate-400 mb-2">
          <span class="text-sm font-medium">Total Income</span>
          <i data-lucide="arrow-down-left" class="w-5 h-5 text-emerald-400"></i>
        </div>
        <div id="totalIncome" class="text-3xl font-bold text-emerald-400">$0.00</div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5">
        <div class="flex items-center justify-between text-slate-400 mb-2">
          <span class="text-sm font-medium">Total Expenses</span>
          <i data-lucide="arrow-up-right" class="w-5 h-5 text-rose-400"></i>
        </div>
        <div id="totalExpenses" class="text-3xl font-bold text-rose-400">$0.00</div>
      </div>
    </div>

    <!-- Main Content: Form + Chart -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Add Transaction Form -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 lg:col-span-1">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i> Add Transaction
        </h2>
        
        <form id="txForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
            <input type="text" id="desc" required placeholder="e.g. Grocery Shopping" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Amount ($)</label>
              <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Type</label>
              <select id="type" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Category</label>
              <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <option value="Food">Food</option>
                <option value="Salary">Salary</option>
                <option value="Rent">Rent</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Date</label>
              <input type="date" id="date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Transaction
          </button>
        </form>
      </div>

      <!-- Expense Breakdown Chart -->
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 lg:col-span-2 flex flex-col">
        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
          <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-400"></i> Expense Breakdown by Category
        </h2>
        <div class="flex-1 min-h-[250px] relative flex items-center justify-center">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>

    </div>

    <!-- Filtering & Transactions List -->
    <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 space-y-4">
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-700/60 pb-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="list" class="w-5 h-5 text-indigo-400"></i> Transaction History
        </h2>

        <!-- Filters -->
        <div class="flex flex-wrap items-center gap-2">
          <select id="filterType" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option value="all">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

          <select id="filterCategory" class="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">
            <option value="all">All Categories</option>
            <option value="Food">Food</option>
            <option value="Salary">Salary</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- List Container -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-xs text-slate-400 uppercase tracking-wider border-b border-slate-700/50">
              <th class="py-3 px-4">Date</th>
              <th class="py-3 px-4">Description</th>
              <th class="py-3 px-4">Category</th>
              <th class="py-3 px-4 text-right">Amount</th>
              <th class="py-3 px-4 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="txList" class="divide-y divide-slate-700/40 text-sm">
            <!-- Transactions rendered via JS -->
          </tbody>
        </table>
        
        <div id="emptyState" class="hidden text-center py-8 text-slate-500 text-sm">
          No transactions found.
        </div>
      </div>

    </div>

  </main>

  <script>
    // App State
    let transactions = JSON.parse(localStorage.getItem('expenses_app_data')) || [
      { id: '1', desc: 'Monthly Salary', amount: 3500, type: 'income', category: 'Salary', date: '2026-07-01' },
      { id: '2', desc: 'Apartment Rent', amount: 1200, type: 'expense', category: 'Rent', date: '2026-07-02' },
      { id: '3', desc: 'Supermarket Groceries', amount: 185.50, type: 'expense', category: 'Food', date: '2026-07-05' }
    ];

    let chartInstance = null;

    // DOM Elements
    const txForm = document.getElementById('txForm');
    const txList = document.getElementById('txList');
    const emptyState = document.getElementById('emptyState');
    const filterType = document.getElementById('filterType');
    const filterCategory = document.getElementById('filterCategory');
    const clearAllBtn = document.getElementById('clearAllBtn');
    
    // Set default date input to today
    document.getElementById('date').valueAsDate = new Date();

    // Initialize Application
    function init() {
      lucide.createIcons();
      renderChart();
      updateDashboard();

      // Event Listeners
      txForm.addEventListener('submit', handleAddTransaction);
      filterType.addEventListener('change', updateDashboard);
      filterCategory.addEventListener('change', updateDashboard);
      clearAllBtn.addEventListener('click', handleClearAll);
    }

    // Save to LocalStorage
    function saveToLocalStorage() {
      localStorage.setItem('expenses_app_data', JSON.stringify(transactions));
    }

    // Handle Add New Transaction
    function handleAddTransaction(e) {
      e.preventDefault();

      const newTx = {
        id: Date.now().toString(),
        desc: document.getElementById('desc').value,
        amount: parseFloat(document.getElementById('amount').value),
        type: document.getElementById('type').value,
        category: document.getElementById('category').value,
        date: document.getElementById('date').value
      };

      transactions.unshift(newTx);
      saveToLocalStorage();
      updateDashboard();

      // Reset form fields
      txForm.reset();
      document.getElementById('date').valueAsDate = new Date();
    }

    // Delete Single Transaction
    window.deleteTransaction = function(id) {
      transactions = transactions.filter(tx => tx.id !== id);
      saveToLocalStorage();
      updateDashboard();
    };

    // Clear All Transactions
    function handleClearAll() {
      if (confirm('Are you sure you want to clear all transaction history?')) {
        transactions = [];
        saveToLocalStorage();
        updateDashboard();
      }
    }

    // Update Dashboard (Summary Cards, Table List, Chart)
    function updateDashboard() {
      // 1. Calculate Summary Totals (all time)
      const income = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);

      const expenses = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      const balance = income - expenses;

      document.getElementById('totalIncome').textContent = `$${income.toFixed(2)}`;
      document.getElementById('totalExpenses').textContent = `$${expenses.toFixed(2)}`;
      document.getElementById('totalBalance').textContent = `$${balance.toFixed(2)}`;

      // 2. Filter Transactions for Table
      const typeVal = filterType.value;
      const catVal = filterCategory.value;

      const filtered = transactions.filter(t => {
        const matchesType = typeVal === 'all' || t.type === typeVal;
        const matchesCat = catVal === 'all' || t.category === catVal;
        return matchesType && matchesCat;
      });

      renderTable(filtered);
      updateChart();
    }

    // Render Transaction Table
    function renderTable(data) {
      txList.innerHTML = '';

      if (data.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      data.forEach(t => {
        const isIncome = t.type === 'income';
        const amountClass = isIncome ? 'text-emerald-400 font-semibold' : 'text-rose-400 font-semibold';
        const amountPrefix = isIncome ? '+' : '-';

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/30 transition-colors';
        row.innerHTML = `
          <td class="py-3 px-4 text-slate-400 text-xs">${t.date}</td>
          <td class="py-3 px-4 text-white font-medium">${t.desc}</td>
          <td class="py-3 px-4">
            <span class="inline-block px-2.5 py-1 rounded-md text-xs font-medium bg-slate-700/50 text-slate-300 border border-slate-600/40">
              ${t.category}
            </span>
          </td>
          <td class="py-3 px-4 text-right ${amountClass}">
            ${amountPrefix}$${t.amount.toFixed(2)}
          </td>
          <td class="py-3 px-4 text-center">
            <button onclick="deleteTransaction('${t.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition-colors">
              <i data-lucide="trash" class="w-4 h-4"></i>
            </button>
          </td>
        `;
        txList.appendChild(row);
      });

      lucide.createIcons();
    }

    // Initialize Chart.js
    function renderChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: [
              '#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#64748b'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: {
                color: '#94a3b8',
                font: { family: 'sans-serif', size: 12 }
              }
            }
          }
        }
      });
    }

    // Update Chart Data based on Expense items
    function updateChart() {
      const expenseMap = {};

      transactions
        .filter(t => t.type === 'expense')
        .forEach(t => {
          expenseMap[t.category] = (expenseMap[t.category] || 0) + t.amount;
        });

      chartInstance.data.labels = Object.keys(expenseMap);
      chartInstance.data.datasets[0].data = Object.values(expenseMap);
      chartInstance.update();
    }

    // Run app on DOM Load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
